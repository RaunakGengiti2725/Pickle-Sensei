name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pickle
          POSTGRES_PASSWORD: pickle_ci_password
          POSTGRES_DB: pickle_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pickle -d pickle_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + integration tests (DB-backed tests run against service container)
        run: pnpm test
        env:
          DATABASE_URL_TEST: postgres://pickle:pickle_ci_password@localhost:5432/pickle_ci

      - name: Migration apply check (fresh database)
        run: |
          pnpm --filter @pickle/database migrate
          pnpm --filter @pickle/database seed
        env:
          DATABASE_URL: postgres://pickle:pickle_ci_password@localhost:5432/pickle_ci
