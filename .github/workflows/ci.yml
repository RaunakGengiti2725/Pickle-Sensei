name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege workflow token: every job only reads the repo. No job may
# write contents, packages, or PRs with the default GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pickle
          POSTGRES_PASSWORD: pickle_ci_password
          POSTGRES_DB: pickle_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pickle -d pickle_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm

      - name: Install ffmpeg (synthetic test fixtures)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + integration tests (sequential — suites share the DB service)
        run: pnpm test
        env:
          DATABASE_URL_TEST: postgres://pickle:pickle_ci_password@localhost:5432/pickle_ci

      - name: Migration apply + seed check (fresh database)
        run: |
          pnpm --filter @pickle/database migrate
          pnpm --filter @pickle/database seed
        env:
          DATABASE_URL: postgres://pickle:pickle_ci_password@localhost:5432/pickle_ci

      - name: ML annotation validator tests
        run: python3 -m unittest discover -s ml/scripts -p 'test_*.py'

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install app deps (npm-managed — see DECISIONS D-013)
        working-directory: apps/mobile
        run: npm ci
      - name: Typecheck
        working-directory: apps/mobile
        run: npx tsc --noEmit
      - name: Jest (logic suites)
        working-directory: apps/mobile
        run: npm test

  supabase-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Supabase RLS + security regression matrix
        run: ./supabase/tests/run_rls_tests.sh

  containers:
    if: github.ref == 'refs/heads/main'
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build api image
        run: docker build -f services/api/Dockerfile -t pickle-api:${{ github.sha }} .
      - name: Build media-worker image
        run: docker build -f services/media-worker/Dockerfile -t pickle-media-worker:${{ github.sha }} .
      # Push to ECR + Terraform plan/deploy gate on AWS credentials being
      # configured as repo secrets; see docs/DEPLOYMENT.md.
