name: Production Monitor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-monitor
  cancel-in-progress: false

jobs:
  public-api:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          package-manager-cache: false
      - name: Verify monitor with local stubs
        run: node --test scripts/tests/monitor-production.test.mjs
      - name: Probe public production API
        run: node scripts/monitor-production.mjs
        env:
          PRODUCTION_MONITOR_READINESS: ${{ vars.PRODUCTION_MONITOR_READINESS || 'false' }}
