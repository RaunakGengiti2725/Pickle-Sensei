# Manual dispatch only, on purpose: this is a PUBLIC repository and the
# runner is a personal machine; fork PRs must never execute on it.
name: Mac Smoke Test

on:
  workflow_dispatch:

# Least-privilege workflow token: read the repo, nothing else.
permissions:
  contents: read

jobs:
  mac-test:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Machine info
        run: |
          echo "=== macOS ==="
          sw_vers

          echo "=== Architecture ==="
          uname -m

          echo "=== Hardware ==="
          system_profiler SPHardwareDataType

      - name: Xcode
        run: |
          echo "=== Xcode path ==="
          xcode-select -p

          echo "=== Xcode version ==="
          xcodebuild -version

      - name: Swift
        run: |
          swift --version

      - name: Available SDKs
        run: |
          xcodebuild -showsdks
