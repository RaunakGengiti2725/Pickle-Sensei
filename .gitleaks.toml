# Gitleaks configuration for Pickle Sensei — consumed by scripts/security-scan.sh.
#
# Every allowlist entry below MUST carry a one-line justification. Entries are
# scoped as narrowly as possible (a specific key name, fixture string, or path)
# so a real credential landing next to a fixture still fails the gate.
# Baseline: gitleaks v8.30.1 default rules (`useDefault = true`) + the custom
# rules at the bottom for credential formats this system actually depends on.

title = "Pickle Sensei secret-scanning policy"

[extend]
useDefault = true

# ─── Path allowlists (files never read) ──────────────────────────────────────

[[allowlists]]
# Local-only env files are gitignored (.env, .env.local, .env.*.local) and may
# legitimately hold a developer's own dev credentials; .env.example stays scanned.
description = "gitignored local env files"
paths = ['''(?:^|/)\.env$''', '''(?:^|/)\.env\.local$''', '''(?:^|/)\.env\.[^/]+\.local$''']

[[allowlists]]
# Committed binary media and ML model artifacts (~820 MB, mostly 44 corpus .mp4):
# text-pattern rules cannot read them, and skipping them keeps the gate at a few
# seconds. Mirrors the default config's image/font/pdf exclusions.
description = "binary video, audio, and ML model artifacts"
paths = ['''(?i)\.(?:mp4|mov|m4v|webm|mp3|wav|npz|npy|task|tflite|mlmodelc?|mlpackage|onnx|pt|pth|pkl)$''']

[[allowlists]]
# CocoaPods lockfile: the `SPEC CHECKSUMS` section is SHA-1 podspec digests
# (`RNKeychain: 551d…`), which the generic-api-key rule mistakes for keys.
description = "CocoaPods Podfile.lock spec checksums"
paths = ['''(?:^|/)Podfile\.lock$''']

[[allowlists]]
# Re-derivable, gitignored build/dependency/media trees (see .gitignore); they are
# large (Pods, .venv, corpus video) and can never reach the repository.
description = "gitignored build, dependency, and media artifact directories"
paths = [
  '''(?:^|/)Pods/''',
  '''(?:^|/)\.venv[^/]*/''',
  '''(?:^|/)\.build/''',
  '''(?:^|/)build/''',
  '''(?:^|/)dist/''',
  '''(?:^|/)coverage/''',
  '''(?:^|/)\.turbo/''',
  '''(?:^|/)vendor/bundle/''',
  '''(?:^|/)datasets/corpus/media/''',
  '''(?:^|/)datasets/corpus/runs/''',
  '''(?:^|/)datasets/paddle-bench/videos/''',
  '''(?:^|/)datasets/paddle-bench/runs/''',
  '''(?:^|/)supabase/\.temp/''',
]

# ─── Regex allowlists (matched against the finding's line) ───────────────────

[[allowlists]]
# Research-corpus record identifiers: `sessionKey`/`subjectKey` are recording
# ids (e.g. "dvids-marne-2024", "rec-6e06a3157947"), `productKey`/`product_key`
# are store product slugs ("premium_monthly_499"). None grants access to anything.
description = "dataset/session/product identifier fields misread as API keys"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''(?i)\b(?:sessionKey|subjectKey|productKey|product_key)"?\s*[:=]''']

[[allowlists]]
# services/api test suites configure the DEV-ONLY HS256 issuer with labeled
# fixture strings ("test-secret-0123456789", "consent-e2e-secret-0123456789").
# The issuer constructor throws outside development/test (docs/SECURITY.md).
description = "labeled dev-issuer HS256 fixtures in services/api tests"
targetRules = ["generic-api-key"]
paths = ['''(?:^|/)services/api/test/.*\.test\.ts$''']
regexes = ['''[a-z0-9-]*secret-0123456789''']

[[allowlists]]
# first-party-intake tests sign synthetic consent-ledger exports with labeled
# fixture keys ("SYNTHETIC-TEST-FIXTURE.<name>-signing-key"); the prefix is the
# package's mandatory marker for fake consent data (README) and grants nothing.
description = "labeled SYNTHETIC-TEST-FIXTURE HMAC keys in first-party-intake tests"
targetRules = ["generic-api-key"]
paths = ['''(?:^|/)packages/first-party-intake/test/.*\.test\.ts$''']
regexes = ['''SYNTHETIC-TEST-FIXTURE\.[a-z0-9.-]*signing-key''']

[[allowlists]]
# Deno edge-function tests stub REVENUECAT_SECRET_API_KEY with the literal
# "sk_test_revenuecat" and assert it is forwarded; it is not a Stripe or
# RevenueCat key.
description = "edge-function test fixture for the RevenueCat secret key env var"
targetRules = ["stripe-access-token", "revenuecat-secret-api-key"]
paths = ['''(?:^|/)supabase/functions/api/__wf__/''']
regexes = ['''sk_test_revenuecat''']

[[allowlists]]
# Mobile security test builds a synthetic "header.<base64 payload>.sig" Google
# ID token to prove the app never persists provider tokens; not a real JWT.
description = "synthetic three-part token fixture in the mobile secrets test"
paths = ['''(?:^|/)apps/mobile/__tests__/wf/be-mobile-security-secrets\.test\.ts$''']
regexes = ['''header\.eyJ[A-Za-z0-9_-]+\.sig''']

[[allowlists]]
# App Store Connect API *Issuer ID* and *Key ID* are team/key identifiers, not
# credentials: nothing can be signed or uploaded without the .p8 private key,
# which is never committed (docs/DISTRIBUTION.md documents the identifiers).
description = "App Store Connect API key identifiers (issuer/key id) in docs"
paths = ['''(?:^|/)docs/DISTRIBUTION\.md$''']
regexes = ['''APP_STORE_CONNECT_API_KEY_(?:ISSUER_ID|KEY_ID)=[A-Za-z0-9-]+''']

[[allowlists]]
# RevenueCat PUBLIC SDK keys (`appl_…`, `goog_…`, `test_…`) are designed to ship
# inside the app binary; they cannot read or mutate subscriber data server-side
# (that needs a `sk_…` secret key). Scoped to the one config file that holds them.
description = "RevenueCat public SDK keys in the mobile runtime config"
paths = ['''(?:^|/)apps/mobile/src/config/runtimeConfig\.ts$''']
regexes = ['''\b(?:appl|goog|test)_[A-Za-z0-9]{20,40}\b''']

# ─── Custom rules for credential formats this system depends on ──────────────
# (Legacy Supabase service_role/anon JWTs, Apple .p8 keys, AWS keys, GitHub
# tokens, and Google API keys are covered by the default rules: jwt,
# private-key, aws-access-token, github-*, gcp-api-key.)

[[rules]]
id = "supabase-secret-api-key"
description = "Supabase secret API key (new-format service key; bypasses RLS)"
regex = '''\b(sb_secret_[A-Za-z0-9_-]{20,})\b'''
keywords = ["sb_secret_"]

[[rules]]
id = "revenuecat-secret-api-key"
description = "RevenueCat secret API key (sk_… without Stripe's test/live infix)"
regex = '''\b(sk_[A-Za-z0-9]{24,})\b'''
entropy = 3
keywords = ["sk_"]

[[rules]]
id = "upstash-redis-rest-token"
description = "Upstash Redis REST token assigned in source or config"
regex = '''(?i)UPSTASH_REDIS_REST_TOKEN\s*[=:]\s*['"]?([A-Za-z0-9=_-]{30,})['"]?'''
keywords = ["upstash_redis_rest_token"]

[[rules]]
id = "revenuecat-webhook-auth"
description = "RevenueCat webhook shared secret assigned in source or config"
regex = '''(?i)REVENUECAT_WEBHOOK_AUTH\s*[=:]\s*['"]?([A-Za-z0-9=_-]{16,})['"]?'''
keywords = ["revenuecat_webhook_auth"]
