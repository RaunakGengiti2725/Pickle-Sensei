# Local development infrastructure (directive §51).
# Developers need no AWS account for ordinary local backend work.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pickle
      POSTGRES_PASSWORD: pickle_dev_password
      POSTGRES_DB: pickle_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-roles.sql:/docker-entrypoint-initdb.d/10-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickle -d pickle_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pickle
      POSTGRES_PASSWORD: pickle_test_password
      POSTGRES_DB: pickle_test
    ports:
      - "5433:5432"
    volumes:
      - ./infra/postgres/init-roles.sql:/docker-entrypoint-initdb.d/10-init-roles.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pickle-local
      MINIO_ROOT_PASSWORD: pickle-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  elasticmq:
    image: softwaremill/elasticmq-native:latest
    ports:
      - "9324:9324"

volumes:
  pgdata:
  miniodata:
